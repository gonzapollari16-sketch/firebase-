
apiVersion: v1
kind: Namespace
metadata:
  name: crushome-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: crushome-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: gateway
        image: crushome/api-gateway:latest
        ports:
        - containerPort: 4000
        envFrom:
        - secretRef:
            name: crushome-secrets
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: crushome-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notifications
        image: crushome/notification-service:latest
        envFrom:
        - secretRef:
            name: crushome-secrets
        - configMapRef:
            name: ads-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: crushome-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
